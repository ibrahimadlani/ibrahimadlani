name: Development Pipeline

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so a green run
      # here means the same tree a fresh clone would get.
      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

      - name: Build project
        run: npm run build
